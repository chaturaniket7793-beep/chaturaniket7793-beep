<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0d1117"/><stop offset="0.55" stop-color="#10223a"/><stop offset="1" stop-color="#0b3b3a"/>
<animate attributeName="x2" values="1;0.6;1" dur="10s" repeatCount="indefinite"/>
